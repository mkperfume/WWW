<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MK Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f1ee; /* لون كريمي هادئ */
            color: #333;
            padding: 40px 0;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: #8B4513; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .section-title { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 1.5rem; }

        /* Form Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border-color: #8B4513; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Order Summary */
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #666;
        }
        .total-row {
            border-top: 2px solid #eee;
            margin-top: 15px;
            padding-top: 15px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #333;
        }

        /* Payment Methods */
        .payment-methods { margin-top: 20px; }
        .method {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .method.active { border-color: #8B4513; background: #fffaf5; }

        .pay-btn {
            width: 100%;
            background: #8B4513;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .pay-btn:hover { background: #5d2e0d; }

        @media (max-width: 768px) {
            .checkout-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body dir="ltr"> <div class="container">
    <a href="index.html" style="text-decoration: none; color: #8B4513;">← Back to Shop</a>
    <h1 style="margin: 20px 0;">Checkout</h1>

    <div class="checkout-grid">
        <div class="card">
            <h2 class="section-title">Shipping Details</h2>
            <form id="checkout-form">
                <div class="row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Full Address</label>
                    <input type="text" placeholder="Street Name, Building No." required>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" required>
                    </div>
                    <div class="form-group">
                        <label>Country</label>
                        <select>
                            <option>Egypt</option>
                            <option>Saudi Arabia</option>
                            <option>UAE</option>
                        </select>
                    </div>
                </div>

                <h2 class="section-title" style="margin-top: 30px;">Payment Method</h2>
                <div class="payment-methods">
                    <div class="method active">
                        <input type="radio" name="pay" checked>
                        <span>Credit Card (Visa/Mastercard)</span>
                    </div>
                    <div class="method">
                        <input type="radio" name="pay">
                        <span>Cash on Delivery (COD)</span>
                    </div>
                </div>

                <div id="card-details">
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" placeholder="**** **** **** ****">
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="text" placeholder="MM/YY">
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" placeholder="123">
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div class="card" style="height: fit-content;">
            <h2 class="section-title">Order Summary</h2>
            <div class="summary-item">
                <span>Eau de Luxe (x1)</span>
                <span>$199.89</span>
            </div>
            <div class="summary-item">
                <span>Midnight Rose (x1)</span>
                <span>$99.99</span>
            </div>
            <div class="summary-item" style="margin-top: 20px;">
                <span>Subtotal</span>
                <span>$299.88</span>
            </div>
            <div class="summary-item">
                <span>Shipping</span>
                <span style="color: #27ae60;">Free</span>
            </div>
            <div class="summary-item total-row">
                <span>Total</span>
                <span>$299.88</span>
            </div>

            <button type="submit" form="checkout-form" class="pay-btn">Complete Purchase</button>
            <p style="text-align: center; font-size: 0.8rem; color: #999; margin-top: 15px;">
                Secure 256-bit SSL Encrypted Payment
            </p>
        </div>
    </div>
</div>

<script>
    // تغيير شكل السعر أو اللغة حسب الرغبة كما في الصفحات السابقة
    // هذه الصفحة مهيأة لتكون الخطوة النهائية في المتجر
    document.getElementById('checkout-form').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Success! Your order has been placed. Thank you for shopping with MK.');
        window.location.href = 'index.html'; // العودة للرئيسية بعد النجاح
    });
</script>

</body>
</html>
